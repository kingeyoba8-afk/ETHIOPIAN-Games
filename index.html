<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ethiopian Adventure Runner - 10 Cultural Levels</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --eth-green: #009b48;
      --eth-yellow: #ffde00;
      --eth-red: #d92121;
      --panel-bg: #1a1d24;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #0f1015;
      color: #f0f0f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 8px;
    }

    #canvas-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 8;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0,0,0,0.8), 0 0 0 3px #2d323f;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .btn-action {
      transition: all 0.1s ease;
      box-shadow: 0 4px 0 rgba(0,0,0,0.4);
    }
    .btn-action:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

<div class="w-full max-w-4xl flex flex-col items-center gap-3">
  
  <!-- Header with clean responsive layout -->
  <header class="w-full bg-[#181a20] border-b-4 border-[#ffde00] rounded-2xl p-3 sm:p-4 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <!-- Ethiopian Flag Icon -->
      <div class="flex h-6 w-10 rounded border border-white/20 overflow-hidden shrink-0">
        <span class="flex-1 bg-[#009b48]"></span>
        <span class="flex-1 bg-[#ffde00]"></span>
        <span class="flex-1 bg-[#d92121]"></span>
      </div>
      <div>
        <h1 class="text-lg sm:text-xl font-extrabold text-white tracking-wide">ETHIOPIAN ADVENTURE RUNNER</h1>
        <p class="text-xs text-amber-400 font-medium">10 Historic Tourism Levels • Sprint to 10,000 Points!</p>
      </div>
    </div>
    
    <!-- Level Selector Dropdown -->
    <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
      <label for="levelSelect" class="text-xs text-gray-300 font-semibold whitespace-nowrap">Jump to:</label>
      <select id="levelSelect" class="bg-[#262a36] text-white text-xs font-bold py-1.5 px-3 rounded-lg border border-gray-600 focus:outline-none focus:border-amber-400 w-full sm:w-auto">
        <option value="1">Lvl 1: Addis Ababa (0pt)</option>
        <option value="2">Lvl 2: Sof Omar Caves (1k)</option>
        <option value="3">Lvl 3: Axum Empire (2k)</option>
        <option value="4">Lvl 4: Lalibela Rock Church (3k)</option>
        <option value="5">Lvl 5: Gondar Castles (4k)</option>
        <option value="6">Lvl 6: Simien Mountains (5k)</option>
        <option value="7">Lvl 7: Harar Walled City (6k)</option>
        <option value="8">Lvl 8: Rome 1960 - Bikila (7k)</option>
        <option value="9">Lvl 9: Battle of Adwa (8k)</option>
        <option value="10">⚡ Lvl 10: Danakil Lava Sprint (9k)</option>
      </select>
    </div>
  </header>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="900" height="450"></canvas>
  </div>

  <!-- Keyboard / Touch Instruction Banner -->
  <div class="w-full bg-[#181a20] rounded-xl px-4 py-2 flex flex-wrap justify-between items-center text-xs text-gray-400 border border-gray-800 gap-2">
    <div>🎮 <strong>Controls:</strong> <span class="bg-gray-800 text-white px-2 py-0.5 rounded font-mono">SPACE / UP</span> Jump | <span class="bg-gray-800 text-white px-2 py-0.5 rounded font-mono">DOWN / S</span> Duck</div>
    <div class="text-amber-400 font-semibold">Goal: Finish Level 10 at 10,000 Points!</div>
  </div>

  <!-- Mobile On-Screen Action Buttons -->
  <div class="grid grid-cols-2 gap-3 w-full">
    <button id="btnDuck" class="btn-action bg-[#2d323f] hover:bg-[#3b4253] text-white font-black py-3.5 sm:py-4 rounded-xl text-base sm:text-lg flex items-center justify-center gap-2 border-b-4 border-gray-900 active:border-b-0">
      👇 DUCK / SLIDE
    </button>
    <button id="btnJump" class="btn-action bg-[#009b48] hover:bg-[#00b856] text-white font-black py-3.5 sm:py-4 rounded-xl text-base sm:text-lg flex items-center justify-center gap-2 border-b-4 border-green-900 active:border-b-0">
      ⬆️ JUMP
    </button>
  </div>

</div>

<script>
  // Web Audio API Synthesizer (Zero external file dependencies)
  const AudioEngine = {
    ctx: null,
    init() {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
    },
    playJump() {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(160, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(480, this.ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.12);
    },
    playCoin() {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(987.77, this.ctx.currentTime);
      osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.22);
    },
    playLevelUp() {
      if (!this.ctx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.07 + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + i * 0.07);
        osc.stop(this.ctx.currentTime + i * 0.07 + 0.18);
      });
    },
    playHit() {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(130, this.ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.25);
    }
  };

  const LEVEL_CONFIGS = [
    {
      lvl: 1,
      name: "Addis Ababa Streets",
      landmark: "Meskel Square & Light Rail",
      hero: "City Runner",
      heroColor: "#009b48",
      bgGradient: ["#2b5876", "#4e4376"],
      groundColor: "#33333d",
      accentColor: "#f1c40f",
      obstacleTypes: ["taxi", "cone"],
      flyingTypes: ["pigeon"]
    },
    {
      lvl: 2,
      name: "Sof Omar Caves",
      landmark: "Limestone Pillars & Rift River",
      hero: "Explorer",
      heroColor: "#d35400",
      bgGradient: ["#1a0f0a", "#3d2314"],
      groundColor: "#2b1810",
      accentColor: "#e67e22",
      obstacleTypes: ["stalagmite", "boulder"],
      flyingTypes: ["bat"]
    },
    {
      lvl: 3,
      name: "Axum Kingdom",
      landmark: "Great Northern Stelae",
      hero: "Axumite Royal",
      heroColor: "#8e44ad",
      bgGradient: ["#1f1c2c", "#928dab"],
      groundColor: "#4b4b54",
      accentColor: "#f39c12",
      obstacleTypes: ["stela_base", "urn"],
      flyingTypes: ["falcon"]
    },
    {
      lvl: 4,
      name: "Lalibela Rock Churches",
      landmark: "Bet Giyorgis Cross Church",
      hero: "Habesha Monk",
      heroColor: "#e67e22",
      bgGradient: ["#451205", "#8d3214"],
      groundColor: "#5c2411",
      accentColor: "#f1c40f",
      obstacleTypes: ["rock_block", "trench"],
      flyingTypes: ["raven"]
    },
    {
      lvl: 5,
      name: "Gondar Royal Enclosure",
      landmark: "Fasilides Castle Towers",
      hero: "Gondar Guard",
      heroColor: "#2980b9",
      bgGradient: ["#1c2833", "#4f5b66"],
      groundColor: "#34495e",
      accentColor: "#f1c40f",
      obstacleTypes: ["barrel", "wall"],
      flyingTypes: ["hawk"]
    },
    {
      lvl: 6,
      name: "Simien Mountains",
      landmark: "Ras Dashen Peaks & Cliffs",
      hero: "Highland Athlete",
      heroColor: "#27ae60",
      bgGradient: ["#0b3024", "#1e6b52"],
      groundColor: "#1b4d3e",
      accentColor: "#a2d9ce",
      obstacleTypes: ["sharp_boulder", "bush"],
      flyingTypes: ["vulture"]
    },
    {
      lvl: 7,
      name: "Harar Jugol (Walled City)",
      landmark: "Historic Gates & Minarets",
      hero: "Harari Trader",
      heroColor: "#e67e22",
      bgGradient: ["#4a1f0d", "#9e481c"],
      groundColor: "#612c12",
      accentColor: "#2ecc71",
      obstacleTypes: ["spice_bag", "hyena"],
      flyingTypes: ["eagle"]
    },
    {
      lvl: 8,
      name: "Rome 1960 Marathon",
      landmark: "Roman Colosseum & Arch",
      hero: "Barefoot Abebe Bikila",
      heroColor: "#1565c0",
      bgGradient: ["#0d1b2a", "#1b263b"],
      groundColor: "#415a77",
      accentColor: "#f4d03f",
      obstacleTypes: ["hurdle", "classic_car"],
      flyingTypes: ["arch_low"]
    },
    {
      lvl: 9,
      name: "Battle of Adwa (1896)",
      landmark: "Adwa Mountain Fortress",
      hero: "Emperor Menelik II",
      heroColor: "#b71c1c",
      bgGradient: ["#2b0000", "#5c0606"],
      groundColor: "#3b0c0c",
      accentColor: "#ffc107",
      obstacleTypes: ["cannon", "sandbag"],
      flyingTypes: ["smoke_cloud"]
    },
    {
      lvl: 10,
      name: "Danakil Lava Sprint",
      landmark: "Erta Ale Volcano & Salt Lake",
      hero: "Fire Runner",
      heroColor: "#ff3d00",
      bgGradient: ["#1a0000", "#660000"],
      groundColor: "#260000",
      accentColor: "#ffea00",
      obstacleTypes: ["lava_crack", "salt_pillar"],
      flyingTypes: ["fireball"]
    }
  ];

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  let game = {
    score: 0,
    level: 1,
    gameSpeed: 6.5,
    isGameOver: false,
    isGameWon: false,
    frameCount: 0,
    lives: 3,
    bunaBoost: 0,
    particles: [],
    obstacles: [],
    collectibles: [],
    notifications: []
  };

  // Player physics state
  const player = {
    x: 90,
    y: 310,
    width: 42,
    height: 70,
    baseHeight: 70,
    duckHeight: 38,
    velocityY: 0,
    gravity: 0.8,
    isJumping: false,
    isDucking: false,
    jumpStrength: -15,
    groundY: 310
  };

  window.addEventListener("keydown", (e) => {
    AudioEngine.init();
    if (["Space", "ArrowUp", "KeyW"].includes(e.code)) {
      e.preventDefault();
      triggerJump();
    }
    if (["ArrowDown", "KeyS"].includes(e.code)) {
      e.preventDefault();
      triggerDuck(true);
    }
    if (e.code === "KeyR" && (game.isGameOver || game.isGameWon)) {
      resetGame();
    }
  });

  window.addEventListener("keyup", (e) => {
    if (["ArrowDown", "KeyS"].includes(e.code)) {
      triggerDuck(false);
    }
  });

  document.getElementById("btnJump").addEventListener("touchstart", (e) => { e.preventDefault(); AudioEngine.init(); triggerJump(); });
  document.getElementById("btnJump").addEventListener("mousedown", () => { AudioEngine.init(); triggerJump(); });

  const duckBtn = document.getElementById("btnDuck");
  duckBtn.addEventListener("touchstart", (e) => { e.preventDefault(); triggerDuck(true); });
  duckBtn.addEventListener("touchend", (e) => { e.preventDefault(); triggerDuck(false); });
  duckBtn.addEventListener("mousedown", () => triggerDuck(true));
  duckBtn.addEventListener("mouseup", () => triggerDuck(false));

  document.getElementById("levelSelect").addEventListener("change", (e) => {
    const selectedLvl = parseInt(e.target.value);
    game.score = (selectedLvl - 1) * 1000;
    if (selectedLvl === 10) game.score = 9000;
    game.isGameOver = false;
    game.isGameWon = false;
    game.obstacles = [];
    game.collectibles = [];
    showNotification(`Jumped to Level ${selectedLvl}!`);
    AudioEngine.playLevelUp();
  });

  function triggerJump() {
    if (game.isGameOver || game.isGameWon) {
      resetGame();
      return;
    }
    if (!player.isJumping) {
      player.velocityY = player.jumpStrength;
      player.isJumping = true;
      AudioEngine.playJump();
      createParticles(player.x + player.width / 2, player.y + player.height, 10, "#d1d5db");
    }
  }

  function triggerDuck(ducking) {
    player.isDucking = ducking;
    if (ducking) {
      player.height = player.duckHeight;
      if (!player.isJumping) player.y = player.groundY + (player.baseHeight - player.duckHeight);
    } else {
      player.height = player.baseHeight;
      if (!player.isJumping) player.y = player.groundY;
    }
  }

  function createParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
      game.particles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 5,
        vy: (Math.random() - 0.8) * 4,
        size: Math.random() * 5 + 2,
        color: color,
        life: 22
      });
    }
  }

  function showNotification(msg) {
    game.notifications.push({ text: msg, alpha: 1.0, y: 160 });
  }

  function updateLevelAndDifficulty() {
    if (game.score >= 10000) {
      game.isGameWon = true;
      return;
    }

    const currentLvl = Math.min(10, Math.floor(game.score / 1000) + 1);

    if (currentLvl !== game.level) {
      game.level = currentLvl;
      document.getElementById("levelSelect").value = game.level;
      AudioEngine.playLevelUp();
      showNotification(`LEVEL ${game.level}: ${LEVEL_CONFIGS[game.level - 1].name}!`);
      createParticles(canvas.width / 2, canvas.height / 2, 50, "#ffde00");
    }

    // Speed formula: levels 1-9 increase smoothly, level 10 goes FAST
    if (game.level < 10) {
      game.gameSpeed = 6.5 + (game.level * 0.95);
    } else {
      game.gameSpeed = 16; // HIGH SPEED DANAKIL SPRINT
    }
  }

  function spawnEntities() {
    const cfg = LEVEL_CONFIGS[game.level - 1];
    let spawnRate = Math.max(30, Math.floor(90 / (game.gameSpeed / 6)));

    if (game.frameCount % spawnRate === 0 && Math.random() < 0.8) {
      const isFlying = Math.random() < 0.32;

      if (isFlying) {
        game.obstacles.push({
          x: canvas.width,
          y: player.groundY - 40 - (Math.random() > 0.5 ? 45 : 0),
          width: 34,
          height: 26,
          isFlying: true,
          type: cfg.flyingTypes[0]
        });
      } else {
        game.obstacles.push({
          x: canvas.width,
          y: player.groundY + (player.baseHeight - 48),
          width: 32,
          height: 48,
          isFlying: false,
          type: cfg.obstacleTypes[Math.floor(Math.random() * cfg.obstacleTypes.length)]
        });
      }
    }

    // Power-ups and Coins
    if (game.frameCount % 160 === 0 && Math.random() < 0.65) {
      const types = ["coin", "buna", "injera"];
      const randType = types[Math.floor(Math.random() * types.length)];
      game.collectibles.push({
        x: canvas.width,
        y: player.groundY - 30 - Math.random() * 80,
        width: 28,
        height: 28,
        type: randType
      });
    }
  }

  function update() {
    if (game.isGameOver || game.isGameWon) return;

    game.frameCount++;
    game.score += 2;
    updateLevelAndDifficulty();

    if (game.bunaBoost > 0) game.bunaBoost--;

    // Player Gravity
    player.velocityY += player.gravity;
    player.y += player.velocityY;

    const currentGround = player.isDucking ? player.groundY + (player.baseHeight - player.duckHeight) : player.groundY;

    if (player.y >= currentGround) {
      player.y = currentGround;
      player.velocityY = 0;
      player.isJumping = false;
    }

    spawnEntities();

    // Obstacles movement & collision
    for (let i = game.obstacles.length - 1; i >= 0; i--) {
      let obs = game.obstacles[i];
      obs.x -= game.gameSpeed;

      if (
        player.x < obs.x + obs.width &&
        player.x + player.width > obs.x &&
        player.y < obs.y + obs.height &&
        player.y + player.height > obs.y
      ) {
        if (game.bunaBoost > 0) {
          createParticles(obs.x, obs.y, 18, "#ffde00");
          game.obstacles.splice(i, 1);
          AudioEngine.playCoin();
          continue;
        }

        AudioEngine.playHit();
        createParticles(player.x, player.y, 25, "#d92121");
        game.obstacles.splice(i, 1);
        game.lives--;

        if (game.lives <= 0) {
          game.isGameOver = true;
        } else {
          showNotification(`Ouch! Lives Left: ${game.lives}`);
        }
      }

      if (obs.x + obs.width < 0) game.obstacles.splice(i, 1);
    }

    // Collectibles movement
    for (let i = game.collectibles.length - 1; i >= 0; i--) {
      let c = game.collectibles[i];
      c.x -= game.gameSpeed;

      if (
        player.x < c.x + c.width &&
        player.x + player.width > c.x &&
        player.y < c.y + c.height &&
        player.y + player.height > c.y
      ) {
        AudioEngine.playCoin();
        if (c.type === "coin") {
          game.score += 150;
          showNotification("+150 Axum Coin!");
        } else if (c.type === "buna") {
          game.bunaBoost = 260;
          showNotification("☕ Buna Boost! Invincible Shield!");
        } else if (c.type === "injera") {
          if (game.lives < 4) game.lives++;
          showNotification("🫓 Injera Restored 1 Life!");
        }
        createParticles(c.x, c.y, 12, "#ffde00");
        game.collectibles.splice(i, 1);
      }

      if (c.x + c.width < 0) game.collectibles.splice(i, 1);
    }

    // Particles update
    for (let i = game.particles.length - 1; i >= 0; i--) {
      let p = game.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      if (p.life <= 0) game.particles.splice(i, 1);
    }
  }

  function drawBackgroundLandmark(lvl) {
    ctx.save();
    ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
    ctx.strokeStyle = "rgba(255, 255, 255, 0.18)";
    ctx.lineWidth = 2;

    switch(lvl) {
      case 1: // Addis Ababa Skyline & Meskel Square / Light Rail
        ctx.fillRect(150, 180, 70, 170); // City Building
        ctx.fillRect(240, 140, 90, 210);
        ctx.fillRect(350, 200, 65, 150);
        // Light Rail Pillars
        for (let x = 0; x < canvas.width; x += 120) {
          ctx.fillRect(x + (game.frameCount * 0.5 % 120), 280, 16, 70);
          ctx.fillRect(x, 280, 120, 8);
        }
        break;

      case 2: // Sof Omar Caves (Stalactites & Cave Pillars)
        ctx.fillStyle = "rgba(100, 60, 30, 0.35)";
        // Cave Ceiling Stalactites
        for (let x = 0; x < canvas.width; x += 80) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x + 40, 120 + Math.sin(x) * 30);
          ctx.lineTo(x + 80, 0);
          ctx.fill();
        }
        // Pillars
        ctx.fillRect(200, 0, 80, canvas.height);
        ctx.fillRect(600, 0, 90, canvas.height);
        break;

      case 3: // Axum Kingdom Obelisks (Stelae)
        ctx.fillStyle = "rgba(200, 200, 220, 0.22)";
        // Main Axum Stela
        const stelaX = 450;
        ctx.beginPath();
        ctx.moveTo(stelaX, 350);
        ctx.lineTo(stelaX + 15, 80);
        ctx.arc(stelaX + 30, 80, 15, Math.PI, 0);
        ctx.lineTo(stelaX + 60, 350);
        ctx.fill();
        // Stela Windows detail
        ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
        for (let y = 110; y < 330; y += 30) {
          ctx.fillRect(stelaX + 18, y, 24, 16);
        }
        break;

      case 4: // Lalibela Bet Giyorgis (Rock-Hewn Cross Church)
        ctx.fillStyle = "rgba(180, 80, 50, 0.35)";
        const laliX = 500;
        // Draw Greek Cross Church Outline
        ctx.fillRect(laliX, 160, 120, 190);
        ctx.fillRect(laliX - 40, 200, 200, 60);
        // Roof Cross motif
        ctx.strokeStyle = "#ffde00";
        ctx.lineWidth = 3;
        ctx.strokeRect(laliX + 40, 170, 40, 40);
        break;

      case 5: // Gondar Castles (Fasilides Castle)
        ctx.fillStyle = "rgba(220, 220, 220, 0.2)";
        // Castle Base & Battlements
        ctx.fillRect(380, 150, 180, 200);
        // Turret Towers
        ctx.beginPath();
        ctx.arc(380, 140, 35, 0, Math.PI * 2);
        ctx.arc(560, 140, 35, 0, Math.PI * 2);
        ctx.fill();
        break;

      case 6: // Simien Mountains (Ras Dashen Peaks)
        ctx.fillStyle = "rgba(40, 120, 80, 0.25)";
        ctx.beginPath();
        ctx.moveTo(0, 350);
        ctx.lineTo(180, 120);
        ctx.lineTo(320, 250);
        ctx.lineTo(520, 90);
        ctx.lineTo(720, 280);
        ctx.lineTo(900, 140);
        ctx.lineTo(900, 350);
        ctx.fill();
        break;

      case 7: // Harar Jugol (Walled City Gates)
        ctx.fillStyle = "rgba(222, 140, 70, 0.25)";
        ctx.fillRect(250, 160, 320, 190);
        // Arch Door
        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.beginPath();
        ctx.arc(410, 280, 60, Math.PI, 0);
        ctx.fill();
        break;

      case 8: // Rome 1960 Marathon (Colosseum & Arches)
        ctx.fillStyle = "rgba(255, 255, 255, 0.18)";
        // Colosseum Arches Silhouette
        for (let x = 200; x < 700; x += 60) {
          ctx.fillRect(x, 180, 45, 170);
          ctx.clearRect(x + 8, 200, 29, 50);
          ctx.clearRect(x + 8, 270, 29, 50);
        }
        break;

      case 9: // Battle of Adwa (Mountain Peaks & Tents)
        ctx.fillStyle = "rgba(180, 40, 40, 0.22)";
        ctx.beginPath();
        ctx.moveTo(100, 350);
        ctx.lineTo(250, 130);
        ctx.lineTo(400, 350);
        ctx.lineTo(600, 110);
        ctx.lineTo(800, 350);
        ctx.fill();
        break;

      case 10: // Danakil Lava & Erta Ale Volcano
        ctx.fillStyle = "rgba(255, 60, 0, 0.3)";
        // Glowing Volcano Peak
        ctx.beginPath();
        ctx.moveTo(250, 350);
        ctx.lineTo(450, 160);
        ctx.lineTo(650, 350);
        ctx.fill();
        // Lava plume
        ctx.fillStyle = "rgba(255, 230, 0, 0.4)";
        ctx.beginPath();
        ctx.arc(450, 150, 30, 0, Math.PI * 2);
        ctx.fill();
        break;
    }
    ctx.restore();
  }

  function drawPlayer(cfg) {
    ctx.save();

    // Buna Aura Shield Glow
    if (game.bunaBoost > 0) {
      ctx.strokeStyle = "#ffde00";
      ctx.shadowColor = "#ffde00";
      ctx.shadowBlur = 15;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(player.x + player.width / 2, player.y + player.height / 2, player.height * 0.75, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    const runCycle = Math.sin(game.frameCount * 0.35); // Leg movement frequency

    if (player.isDucking) {
      // --- CROUCH / DUCK POSE ---
      // Torso / Outfit
      ctx.fillStyle = cfg.heroColor;
      ctx.fillRect(player.x, player.y + 12, player.width, 22);
      // Head
      ctx.fillStyle = "#8d5524"; // Skin tone
      ctx.beginPath();
      ctx.arc(player.x + player.width - 6, player.y + 10, 12, 0, Math.PI * 2);
      ctx.fill();
      // Hair / Crown
      ctx.fillStyle = "#111";
      ctx.fillRect(player.x + player.width - 16, player.y - 2, 16, 8);
      // Sliding Legs
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(player.x - 10, player.y + 26, 28, 10);
    } else {
      // --- ANIMATED RUNNING POSE ---
      const headX = player.x + player.width / 2;
      const headY = player.y + 14;

      // 1. Moving Back Leg
      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(headX, player.y + 38);
      if (player.isJumping) {
        ctx.lineTo(headX - 18, player.y + 52);
        ctx.lineTo(headX - 10, player.y + 68);
      } else {
        ctx.lineTo(headX + (runCycle * 18), player.y + 54);
        ctx.lineTo(headX + (runCycle * 22), player.y + player.height);
      }
      ctx.stroke();

      // 2. Torso / Traditional Shirt
      ctx.fillStyle = cfg.heroColor;
      ctx.fillRect(player.x + 8, player.y + 22, player.width - 16, 26);

      // Habesha Netela / Shawl Accent
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(player.x + 10, player.y + 24, player.width - 20, 8);
      ctx.fillStyle = "#ffde00";
      ctx.fillRect(player.x + 10, player.y + 32, player.width - 20, 3);

      // 3. Head & Afro / Royal Crown
      ctx.fillStyle = "#8d5524"; // Skin tone
      ctx.beginPath();
      ctx.arc(headX + 4, headY, 12, 0, Math.PI * 2);
      ctx.fill();

      // Hair
      ctx.fillStyle = "#0f0f14";
      ctx.beginPath();
      ctx.arc(headX + 2, headY - 3, 13, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(headX + 8, headY - 3, 4, 4);
      ctx.fillStyle = "#000000";
      ctx.fillRect(headX + 10, headY - 2, 2, 2);

      // 4. Moving Front Leg
      ctx.strokeStyle = "#2e384d";
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(headX, player.y + 38);
      if (player.isJumping) {
        ctx.lineTo(headX + 16, player.y + 50);
        ctx.lineTo(headX + 22, player.y + 66);
      } else {
        ctx.lineTo(headX - (runCycle * 18), player.y + 54);
        ctx.lineTo(headX - (runCycle * 22), player.y + player.height);
      }
      ctx.stroke();

      // Barefoot / Running Shoe Accent
      if (game.level === 8) {
        // Abebe Bikila running barefoot!
      } else {
        ctx.fillStyle = "#009b48"; // Green running shoes
        ctx.fillRect(headX - (runCycle * 22) - 3, player.y + player.height - 4, 10, 5);
      }

      // 5. Moving Arms
      ctx.strokeStyle = "#8d5524";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(headX, player.y + 28);
      ctx.lineTo(headX - (runCycle * 16), player.y + 38);
      ctx.stroke();
    }

    ctx.restore();
  }

  function draw() {
    const cfg = LEVEL_CONFIGS[game.level - 1];

    // 1. Sky Gradient Background
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, cfg.bgGradient[0]);
    grad.addColorStop(1, cfg.bgGradient[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Parallax Cultural Sun / Moon
    ctx.fillStyle = "rgba(255, 222, 0, 0.25)";
    ctx.beginPath();
    ctx.arc(canvas.width - 120, 90, 55, 0, Math.PI * 2);
    ctx.fill();

    // 2. Draw Tourism Landmark Silhouette
    drawBackgroundLandmark(game.level);

    // 3. Draw Ground
    ctx.fillStyle = cfg.groundColor;
    ctx.fillRect(0, player.groundY + player.baseHeight, canvas.width, canvas.height - (player.groundY + player.baseHeight));
    
    // Ethiopian Flag Ground Stripe
    ctx.fillStyle = "#009b48";
    ctx.fillRect(0, player.groundY + player.baseHeight, canvas.width, 3);
    ctx.fillStyle = "#ffde00";
    ctx.fillRect(0, player.groundY + player.baseHeight + 3, canvas.width, 3);
    ctx.fillStyle = "#d92121";
    ctx.fillRect(0, player.groundY + player.baseHeight + 6, canvas.width, 3);

    // 4. Draw Animated Runner Character
    drawPlayer(cfg);

    // 5. Draw Obstacles
    for (let obs of game.obstacles) {
      if (obs.isFlying) {
        ctx.fillStyle = "#e74c3c";
        ctx.beginPath();
        ctx.ellipse(obs.x + obs.width / 2, obs.y + obs.height / 2, obs.width / 2, obs.height / 3, 0, 0, Math.PI * 2);
        ctx.fill();
        // Flapping wings
        const wingY = Math.sin(game.frameCount * 0.4) * 8;
        ctx.fillStyle = "#c0392b";
        ctx.fillRect(obs.x + 6, obs.y - 6 + wingY, 12, 8);
      } else {
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        ctx.fillStyle = cfg.accentColor;
        ctx.fillRect(obs.x + 4, obs.y + 4, obs.width - 8, 6);
      }
    }

    // 6. Draw Collectibles
    for (let c of game.collectibles) {
      ctx.font = "22px Arial";
      if (c.type === "coin") ctx.fillText("🪙", c.x, c.y + 22);
      else if (c.type === "buna") ctx.fillText("☕", c.x, c.y + 22);
      else if (c.type === "injera") ctx.fillText("🫓", c.x, c.y + 22);
    }

    // 7. Draw Particles
    for (let p of game.particles) {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }

    // 8. HUD (Heads Up Display Bar)
    ctx.fillStyle = "rgba(15, 16, 21, 0.75)";
    ctx.fillRect(12, 12, canvas.width - 24, 52);
    ctx.strokeStyle = "#ffde00";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(12, 12, canvas.width - 24, 52);

    // Score Counter
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 16px Inter, sans-serif";
    ctx.fillText(`SCORE:`, 26, 42);
    ctx.fillStyle = "#ffde00";
    ctx.font = "bold 18px Inter, sans-serif";
    ctx.fillText(`${game.score} / 10,000`, 90, 42);

    // Level Title Badge
    ctx.fillStyle = "#009b48";
    ctx.fillRect(260, 22, 350, 32);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 14px Inter, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`LVL ${game.level}: ${cfg.name}`, 435, 43);
    ctx.textAlign = "left";

    // Health Lives
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 15px Inter, sans-serif";
    let hearts = "";
    for (let l = 0; l < game.lives; l++) hearts += "❤️ ";
    ctx.fillText(`LIVES: ${hearts}`, canvas.width - 190, 42);

    // Level 10 High Speed Alert Banner
    if (game.level === 10 && !game.isGameOver && !game.isGameWon) {
      ctx.fillStyle = "rgba(217, 33, 33, 0.9)";
      ctx.fillRect(0, 70, canvas.width, 32);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 15px Inter";
      ctx.textAlign = "center";
      ctx.fillText("⚡ MAX SPEED DANAKIL SPRINT! REACH 10,000 POINTS TO WIN! ⚡", canvas.width / 2, 91);
      ctx.textAlign = "left";
    }

    // Floating text notifications
    for (let i = game.notifications.length - 1; i >= 0; i--) {
      let n = game.notifications[i];
      ctx.fillStyle = `rgba(255, 222, 0, ${n.alpha})`;
      ctx.font = "bold 18px Inter";
      ctx.fillText(n.text, 30, n.y);
      n.y -= 0.6;
      n.alpha -= 0.015;
      if (n.alpha <= 0) game.notifications.splice(i, 1);
    }

    // Game Over Overlay
    if (game.isGameOver) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.88)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#d92121";
      ctx.font = "bold 40px Inter";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", canvas.width / 2, 160);

      ctx.fillStyle = "#ffffff";
      ctx.font = "18px Inter";
      ctx.fillText(`You reached Level ${game.level} (${cfg.name}) with ${game.score} pts!`, canvas.width / 2, 210);

      ctx.fillStyle = "#ffde00";
      ctx.font = "bold 18px Inter";
      ctx.fillText("Press SPACE or TAP JUMP to Play Again!", canvas.width / 2, 260);
      ctx.textAlign = "left";
    }

    // Victory Overlay (10,000 Points)
    if (game.isGameWon) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.92)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#009b48";
      ctx.font = "bold 38px Inter";
      ctx.textAlign = "center";
      ctx.fillText("🎉 CONGRATULATIONS! YOU WON! 🎉", canvas.width / 2, 140);

      ctx.fillStyle = "#ffde00";
      ctx.font = "bold 22px Inter";
      ctx.fillText("🏆 Master Champion of Ethiopian History & Culture 🏆", canvas.width / 2, 190);

      ctx.fillStyle = "#ffffff";
      ctx.font = "17px Inter";
      ctx.fillText("You completed all 10 Levels and reached 10,000 Points!", canvas.width / 2, 235);

      ctx.fillStyle = "#009b48";
      ctx.font = "bold 18px Inter";
      ctx.fillText("Press SPACE or TAP JUMP to Restart Victory Lap!", canvas.width / 2, 285);
      ctx.textAlign = "left";
    }
  }

  function resetGame() {
    game.score = 0;
    game.level = 1;
    game.gameSpeed = 6.5;
    game.isGameOver = false;
    game.isGameWon = false;
    game.lives = 3;
    game.bunaBoost = 0;
    game.obstacles = [];
    game.collectibles = [];
    game.particles = [];
    document.getElementById("levelSelect").value = "1";
    player.y = player.groundY;
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // Launch game
  gameLoop();
</script>
</body>
</html>
